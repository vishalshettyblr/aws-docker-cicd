name: Docker CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::268005547470:role/GitHubActions-ECR-Role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: my-cloud-web
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 using SSM
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/my-cloud-web:${{ github.sha }}
          INSTANCE_ID: i-0bb2bcf2815439175
        run: |
          DEPLOY_SCRIPT="set -e; aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 268005547470.dkr.ecr.us-east-1.amazonaws.com; docker pull $IMAGE_URI; docker stop ecr-web-app || true; docker rm ecr-web-app || true; docker run -d --name ecr-web-app -p 8081:80 $IMAGE_URI"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Docker image" \
            --parameters "commands=$DEPLOY_SCRIPT" \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region us-east-1

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region us-east-1 \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          test "$STATUS" = "Success"
